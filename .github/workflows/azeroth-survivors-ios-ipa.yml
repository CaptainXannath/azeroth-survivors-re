name: iOS IPA
on:
  workflow_dispatch:
  push:
    branches:
      - ios-port-experiment
    paths:
      - '.github/workflows/azeroth-survivors-ios-ipa.yml'
      - '.github/workflows/ios-ipa.yml'
      - 'ios/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'third_party/**'
permissions:
  contents: read
concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-ios-ipa:
    name: Build unsigned iPhone IPA
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
      - name: Set up Rust for iOS
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios
          rustc -V
          cargo -V
          xcodebuild -version
      - name: Build the iOS application with Xcode and Bevy's Cargo target
        shell: bash
        run: |
          set -euxo pipefail
          xcodebuild \
            -project ios/WarcraftSurvivors.xcodeproj \
            -scheme WarcraftSurvivors \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH="$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/WarcraftSurvivors.app"
          test -x "$APP_PATH/WarcraftSurvivors"
          plutil -lint "$APP_PATH/Info.plist"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry \
            "$GITHUB_WORKSPACE/WarcraftSurvivors-unsigned.ipa" \
            Payload
          test -s "$GITHUB_WORKSPACE/WarcraftSurvivors-unsigned.ipa"
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarcraftSurvivors-unsigned-IPA
          path: WarcraftSurvivors-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
