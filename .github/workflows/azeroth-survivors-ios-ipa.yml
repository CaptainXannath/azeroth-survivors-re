name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - ios-port-experiment
    paths:
      - '.github/workflows/ios-ipa.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'scripts/**'
      - 'ios/**'

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-ipa:
    name: Build unsigned iPhone IPA
    runs-on: macos-15
    timeout-minutes: 180

    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      IPHONEOS_DEPLOYMENT_TARGET: '15.0'

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Rust and iOS target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios
          rustc -V
          cargo -V
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check required iOS project files
        shell: bash
        run: |
          test -f Cargo.toml
          test -f crates/warcraft-survivors/Cargo.toml
          test -f crates/benilla-app/src/survivors/mod.rs
          echo "Repository files found."
          echo "The native iOS host and touch-control integration still need to be implemented and validated before an IPA can be built."

      - name: Build Rust library
        shell: bash
        run: |
          cargo build --locked --release \
            --target aarch64-apple-ios \
            -p warcraft-survivors --lib --no-default-features
