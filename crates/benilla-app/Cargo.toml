
[package]
name = "benilla-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Bevy app as a library: everything but the build-id stamp, which lives in the `benilla` launcher so a new commit does not rebuild this crate"

[lints]
workspace = true

[features]
default = ["dev"]
dev = ["benilla-assets/dev", "benilla-formats/dev", "benilla-world/dev", "dep:bevy_egui"]
tracy = ["bevy/trace_tracy"]
trace_chrome = ["bevy/trace_chrome"]
webgl2 = ["bevy/webgl2", "benilla-world/webgl2"]
webgpu = ["bevy/webgpu", "benilla-world/webgpu"]

[dependencies]
web-time = "1"
anyhow.workspace = true
benilla-ui = { path = "../benilla-ui" }
bevy.workspace = true
wgpu.workspace = true
bevy_egui = { version = "0.39", optional = true }
bytemuck = { version = "1", features = ["derive"] }
half = "2"
include_dir = "0.7"
regex = "1"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
crossbeam-channel = "0.5"
async-channel = "2.5"
futures-lite = "2.6.1"
benilla-assets = { path = "../benilla-assets", default-features = false }
benilla-formats = { path = "../benilla-formats", default-features = false }
benilla-protocol = { path = "../benilla-protocol" }
benilla-world = { path = "../benilla-world", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
avian3d = "0.6"
cosmic-text = "0.16"
winit = { version = "0.30", default-features = false }
fontdb = "0.23"
kira = { version = "0.12", default-features = false, features = ["mp3", "wav", "pcm", "adpcm"] }
assert_no_alloc = "1.1"
symphonia = { version = "0.6", default-features = false }
rtrb = "0.3"
mint = "0.5"
rand = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3"

# Wayland clipboard is Linux desktop only, not iOS.
[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
smithay-clipboard = "0.7"

[target.'cfg(target_os = "ios")'.dependencies]
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioSession", "AVAudioSessionTypes"] }

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = { version = "0.13", default-features = false, features = ["audio_unit", "core_audio"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = [
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
    "NSWindow",
    "NSView",
    "NSImage",
    "NSCursor",
    "NSEvent",
] }
objc2-foundation = { version = "0.2", features = ["NSArray", "NSData", "NSGeometry"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.122"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
cpal = { version = "0.17", features = ["wasm-bindgen"] }
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "RequestInit",
    "Window",
    "Location",
    "Storage",
    "Response",
    "AudioBuffer",
    "BaseAudioContext",
    "OfflineAudioContext",
] }

[target.'cfg(all(not(target_os = "macos"), not(target_arch = "wasm32")))'.dependencies]
cpal = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
benilla-srp = { path = "../benilla-srp" }
num-bigint = "0.4.6"
sha1.workspace = true
serde_json = "1"
